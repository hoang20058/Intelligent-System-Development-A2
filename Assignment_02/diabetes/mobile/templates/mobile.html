<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HealthScreen Mobile — Dự đoán Tiểu đường</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --subtext: #64748b;
            --danger: #ef4444;
            --success: #10b981;
        }
        body {
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-frame {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 0 12px #1e293b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        @media (max-width: 500px) {
            .phone-frame {
                border-radius: 0;
                box-shadow: none;
                max-height: 100vh;
            }
            body { background: var(--bg); }
        }
        /* Mobile Status Bar */
        .status-bar {
            height: 44px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            z-index: 10;
        }
        .status-icons { display: flex; gap: 6px; font-size: 11px; }
        /* Mobile Header */
        .app-header {
            padding: 14px 20px;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .app-header-icon {
            width: 36px;
            height: 36px;
            background: #ecfdf5;
            color: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .app-header-title { font-size: 16px; font-weight: 700; color: var(--text); margin: 0; }
        .app-header-sub { font-size: 11px; color: var(--subtext); margin: 0; }
        /* Scrollable Screen Content */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .mobile-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 14px;
            border: 1px solid #f1f5f9;
        }
        .card-header-sm {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary-dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-label-sm {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
            display: block;
        }
        .chip-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .chip-btn {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }
        .chip-btn.danger-active {
            background: var(--danger);
            border-color: var(--danger);
            color: #ffffff;
        }
        .m-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            font-size: 14px;
            background: #f8fafc;
            color: var(--text);
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .m-input:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-predict {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(5,150,105,0.3);
            margin-top: 8px;
        }
        .btn-predict:active { transform: scale(0.98); }
        /* Result Sheet */
        .result-sheet {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px;
            margin-top: 14px;
            border: 2px solid #e2e8f0;
            text-align: center;
            display: none;
        }
        .result-sheet.safe {
            border-color: #10b981;
            background: #ecfdf5;
        }
        .result-sheet.risk {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .res-icon { font-size: 38px; margin-bottom: 6px; }
        .res-title { font-size: 18px; font-weight: 800; margin: 0; }
        .res-safe { color: #047857; }
        .res-risk { color: #dc2626; }
        .res-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin: 8px 0;
            background: #ffffff;
        }
        .res-desc { font-size: 12px; color: var(--subtext); line-height: 1.4; margin-top: 6px; }
        /* Bottom Tab Bar */
        .bottom-nav {
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }
        .nav-item {
            text-align: center;
            color: var(--subtext);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
        }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- App Header -->
    <div class="app-header">
        <div class="app-header-icon">
            <i class="fas fa-heartbeat"></i>
        </div>
        <div>
            <h1 class="app-header-title">HealthScreen Mobile</h1>
            <p class="app-header-sub">Sàng lọc Tiểu đường • REST API Client</p>
        </div>
    </div>

    <!-- Screen Content -->
    <div class="screen-content">
        <form id="mobileForm">
            <!-- Card 1: Thông tin bệnh nhân -->
            <div class="mobile-card">
                <div class="card-header-sm"><i class="fas fa-user"></i> 1. Thông tin cá nhân</div>
                
                <label class="form-label-sm">Giới tính</label>
                <div class="chip-group" id="genderGroup">
                    <button type="button" class="chip-btn active" data-val="Female">Nữ</button>
                    <button type="button" class="chip-btn" data-val="Male">Nam</button>
                    <button type="button" class="chip-btn" data-val="Other">Khác</button>
                </div>

                <div class="grid-2">
                    <div>
                        <label class="form-label-sm">Tuổi (Năm)</label>
                        <input type="number" id="age" class="m-input" value="45" min="1" max="120" required>
                    </div>
                    <div>
                        <label class="form-label-sm">Chủng tộc</label>
                        <select id="race" class="m-input">
                            <option value="Caucasian" selected>Caucasian</option>
                            <option value="Asian">Asian</option>
                            <option value="AfricanAmerican">African American</option>
                            <option value="Hispanic">Hispanic</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Card 2: Tiền sử & Chỉ số y tế -->
            <div class="mobile-card">
                <div class="card-header-sm"><i class="fas fa-notes-medical"></i> 2. Tiền sử & Thói quen</div>
                
                <div class="grid-2">
                    <div>
                        <label class="form-label-sm">Huyết áp cao?</label>
                        <div class="chip-group" id="hyperGroup">
                            <button type="button" class="chip-btn active" data-val="0">Không</button>
                            <button type="button" class="chip-btn" data-val="1">Có</button>
                        </div>
                    </div>
                    <div>
                        <label class="form-label-sm">Bệnh tim mạch?</label>
                        <div class="chip-group" id="heartGroup">
                            <button type="button" class="chip-btn active" data-val="0">Không</button>
                            <button type="button" class="chip-btn" data-val="1">Có</button>
                        </div>
                    </div>
                </div>

                <label class="form-label-sm">Hút thuốc lá</label>
                <div class="chip-group" id="smokeGroup">
                    <button type="button" class="chip-btn active" data-val="never">Không</button>
                    <button type="button" class="chip-btn" data-val="former">Đã bỏ</button>
                    <button type="button" class="chip-btn" data-val="current">Đang hút</button>
                </div>
            </div>

            <!-- Card 3: Chỉ số sinh hóa máu -->
            <div class="mobile-card">
                <div class="card-header-sm"><i class="fas fa-vial"></i> 3. Chỉ số xét nghiệm sinh hóa</div>
                
                <label class="form-label-sm">Chỉ số khối cơ thể BMI (kg/m²)</label>
                <input type="number" step="0.1" id="bmi" class="m-input" value="27.5" required>

                <div class="grid-2">
                    <div>
                        <label class="form-label-sm">HbA1c (%)</label>
                        <input type="number" step="0.1" id="hba1c" class="m-input" value="6.5" required>
                    </div>
                    <div>
                        <label class="form-label-sm">Đường huyết (mg/dL)</label>
                        <input type="number" id="glucose" class="m-input" value="145" required>
                    </div>
                </div>

                <button type="button" id="btnSubmit" class="btn-predict">
                    <i class="fas fa-search"></i> CHẨN ĐOÁN NGAY QUA API
                </button>
            </div>
        </form>

        <!-- Result Sheet -->
        <div id="resultSheet" class="result-sheet">
            <div id="resIcon" class="res-icon"></div>
            <h2 id="resTitle" class="res-title"></h2>
            <div id="resBadge" class="res-badge"></div>
            <div id="resDesc" class="res-desc"></div>
        </div>
    </div>

    <!-- Bottom Tab Navigation -->
    <div class="bottom-nav">
        <a href="/mobile" class="nav-item active"><i class="fas fa-heartbeat"></i>Tiểu đường</a>
        <a href="http://localhost:8002/mobile" class="nav-item"><i class="fas fa-home"></i>Giá nhà</a>
        <a href="http://localhost:8003/mobile" class="nav-item"><i class="fas fa-headset"></i>CSAT</a>
    </div>
</div>

<script>
    // Chip toggle helper
    function setupChips(groupId, defaultVal) {
        const group = document.getElementById(groupId);
        let selected = defaultVal;
        group.querySelectorAll('.chip-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                group.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active', 'danger-active'));
                btn.classList.add(btn.dataset.val == '1' ? 'danger-active' : 'active');
                selected = btn.dataset.val;
            });
        });
        return () => selected;
    }

    const getGender = setupChips('genderGroup', 'Female');
    const getHyper = setupChips('hyperGroup', '0');
    const getHeart = setupChips('heartGroup', '0');
    const getSmoke = setupChips('smokeGroup', 'never');

    document.getElementById('btnSubmit').addEventListener('click', async () => {
        const payload = {
            gender: getGender(),
            age: parseInt(document.getElementById('age').value),
            race: document.getElementById('race').value,
            hypertension: parseInt(getHyper()),
            heart_disease: parseInt(getHeart()),
            smoking_history: getSmoke(),
            bmi: parseFloat(document.getElementById('bmi').value),
            hbA1c_level: parseFloat(document.getElementById('hba1c').value),
            blood_glucose_level: parseInt(document.getElementById('glucose').value)
        };

        const btn = document.getElementById('btnSubmit');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang phân tích qua REST API...';
        btn.disabled = true;

        try {
            const res = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            showResult(data);
        } catch (e) {
            // Fallback estimation
            const isRisk = payload.hbA1c_level >= 6.5 || payload.blood_glucose_level >= 140;
            showResult({
                prediction: isRisk ? 1 : 0,
                label: isRisk ? "Có nguy cơ tiểu đường" : "Không có nguy cơ tiểu đường",
                confidence: 94.5,
                model_used: "Random Forest (Tuned) Client"
            });
        } finally {
            btn.innerHTML = '<i class="fas fa-search"></i> CHẨN ĐOÁN NGAY QUA API';
            btn.disabled = false;
        }
    });

    function showResult(data) {
        const sheet = document.getElementById('resultSheet');
        const isRisk = data.prediction === 1;
        sheet.className = 'result-sheet ' + (isRisk ? 'risk' : 'safe');
        sheet.style.display = 'block';

        document.getElementById('resIcon').innerHTML = isRisk ? '⚠️' : '✅';
        document.getElementById('resTitle').innerHTML = isRisk ? 'CẢNH BÁO NGUY CƠ TIỂU ĐƯỜNG' : 'CHỈ SỐ BÌNH THƯỜNG';
        document.getElementById('resTitle').className = 'res-title ' + (isRisk ? 'res-risk' : 'res-safe');
        document.getElementById('resBadge').innerHTML = `Độ tin cậy: ${data.confidence}% • Model: ${data.model_used || 'Random Forest'}`;
        document.getElementById('resDesc').innerHTML = isRisk 
            ? 'Khuyến cáo: Chỉ số HbA1c hoặc Đường huyết vượt ngưỡng khuyến nghị của ADA (&ge; 6.5% hoặc &ge; 126 mg/dL). Vui lòng đến cơ sở y tế để kiểm tra chuyên sâu.'
            : 'Khuyến cáo: Kết quả sàng lọc ban đầu an toàn. Tiếp tục duy trì chế độ dinh dưỡng và lối sống lành mạnh.';
        sheet.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
