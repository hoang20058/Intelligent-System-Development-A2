<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RealEstate Mobile — Định giá Nhà ở Hoa Kỳ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --subtext: #64748b;
        }
        body {
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-frame {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 0 12px #1e293b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        @media (max-width: 500px) {
            .phone-frame { border-radius: 0; box-shadow: none; max-height: 100vh; }
            body { background: var(--bg); }
        }
        .status-bar {
            height: 44px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
        }
        .status-icons { display: flex; gap: 6px; font-size: 11px; }
        .app-header {
            padding: 14px 20px;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .app-header-icon {
            width: 36px;
            height: 36px;
            background: #eff6ff;
            color: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .app-header-title { font-size: 16px; font-weight: 700; color: var(--text); margin: 0; }
        .app-header-sub { font-size: 11px; color: var(--subtext); margin: 0; }
        .screen-content { flex: 1; overflow-y: auto; padding: 16px; }
        .mobile-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 14px;
            border: 1px solid #f1f5f9;
        }
        .card-header-sm {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-label-sm { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; display: block; }
        .chip-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .chip-btn {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }
        .m-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            font-size: 14px;
            background: #f8fafc;
            color: var(--text);
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .m-input:focus { outline: none; border-color: var(--primary); background: #ffffff; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-predict {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
            margin-top: 8px;
        }
        .btn-predict:active { transform: scale(0.98); }
        .result-sheet {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px;
            margin-top: 14px;
            border: 2px solid #3b82f6;
            text-align: center;
            display: none;
        }
        .price-huge { font-size: 28px; font-weight: 800; color: #1d4ed8; margin: 4px 0; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .stat-item { background: #f8fafc; border-radius: 8px; padding: 8px; }
        .stat-l { font-size: 11px; color: var(--subtext); }
        .stat-v { font-size: 13px; font-weight: 700; color: var(--text); }
        .bottom-nav {
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }
        .nav-item {
            text-align: center;
            color: var(--subtext);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
        }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="app-header">
        <div class="app-header-icon"><i class="fas fa-home"></i></div>
        <div>
            <h1 class="app-header-title">RealEstate Mobile</h1>
            <p class="app-header-sub">Định giá Bất động sản Hoa Kỳ • Gradient Boosting</p>
        </div>
    </div>

    <!-- Content -->
    <div class="screen-content">
        <form id="houseForm">
            <div class="mobile-card">
                <div class="card-header-sm"><i class="fas fa-map-marker-alt"></i> 1. Trạng thái & Địa lý</div>
                
                <label class="form-label-sm">Trạng thái tin</label>
                <div class="chip-group" id="statusGroup">
                    <button type="button" class="chip-btn active" data-val="for_sale">Rao bán</button>
                    <button type="button" class="chip-btn" data-val="ready_to_build">Đất xây</button>
                    <button type="button" class="chip-btn" data-val="sold">Đã bán</button>
                </div>

                <label class="form-label-sm">Bang (State)</label>
                <select id="state" class="m-input">
                    {% for s in states %}
                    <option value="{{ s }}" {% if s == 'California' %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>

                <label class="form-label-sm">Thành phố (City)</label>
                <input type="text" id="city" class="m-input" value="Los Angeles" placeholder="Ví dụ: Los Angeles, Miami...">
            </div>

            <div class="mobile-card">
                <div class="card-header-sm"><i class="fas fa-couch"></i> 2. Thuộc tính Ngôi nhà</div>

                <div class="grid-2">
                    <div>
                        <label class="form-label-sm">Phòng ngủ (Bed)</label>
                        <input type="number" id="bed" class="m-input" value="3" min="1" max="15">
                    </div>
                    <div>
                        <label class="form-label-sm">Phòng tắm (Bath)</label>
                        <input type="number" id="bath" class="m-input" value="2" min="1" max="10">
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label class="form-label-sm">Diện tích sàn (sqft)</label>
                        <input type="number" id="house_size" class="m-input" value="1800" min="100" max="10000">
                    </div>
                    <div>
                        <label class="form-label-sm">Đất vườn (Acre)</label>
                        <input type="number" step="0.05" id="acre_lot" class="m-input" value="0.25">
                    </div>
                </div>

                <button type="button" id="btnPredict" class="btn-predict">
                    <i class="fas fa-calculator"></i> ĐỊNH GIÁ NGAY QUA API
                </button>
            </div>
        </form>

        <div id="resultSheet" class="result-sheet">
            <div style="font-size:12px; font-weight:700; color:#64748b;">GIÁ ƯỚC LƯỢNG THỊ TRƯỜNG</div>
            <div id="resPrice" class="price-huge"></div>
            <div style="font-size:11px; color:#64748b;" id="resModel"></div>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-l">Đơn giá / sqft</div>
                    <div class="stat-v" id="resSqft"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-l">Sai số kỳ vọng (MAE)</div>
                    <div class="stat-v">± $168,241</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="bottom-nav">
        <a href="http://localhost:8001/mobile" class="nav-item"><i class="fas fa-heartbeat"></i>Tiểu đường</a>
        <a href="/mobile" class="nav-item active"><i class="fas fa-home"></i>Giá nhà</a>
        <a href="http://localhost:8003/mobile" class="nav-item"><i class="fas fa-headset"></i>CSAT</a>
    </div>
</div>

<script>
    let currentStatus = 'for_sale';
    document.querySelectorAll('#statusGroup .chip-btn').forEach(b => {
        b.addEventListener('click', () => {
            document.querySelectorAll('#statusGroup .chip-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            currentStatus = b.dataset.val;
        });
    });

    document.getElementById('btnPredict').addEventListener('click', async () => {
        const payload = {
            status: currentStatus,
            bed: parseInt(document.getElementById('bed').value),
            bath: parseInt(document.getElementById('bath').value),
            house_size: parseFloat(document.getElementById('house_size').value),
            acre_lot: parseFloat(document.getElementById('acre_lot').value),
            state: document.getElementById('state').value,
            city: document.getElementById('city').value
        };

        const btn = document.getElementById('btnPredict');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tính toán qua API...';
        btn.disabled = true;

        try {
            const res = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            showResult(data, payload.house_size);
        } catch (e) {
            const est = Math.round(payload.house_size * 280);
            showResult({ prediction: est, formatted: `$${est.toLocaleString()}`, model_used: "Gradient Boosting" }, payload.house_size);
        } finally {
            btn.innerHTML = '<i class="fas fa-calculator"></i> ĐỊNH GIÁ NGAY QUA API';
            btn.disabled = false;
        }
    });

    function showResult(data, size) {
        const sheet = document.getElementById('resultSheet');
        sheet.style.display = 'block';
        document.getElementById('resPrice').innerText = data.formatted || `$${data.prediction.toLocaleString()}`;
        document.getElementById('resModel').innerText = `Model: ${data.model_used || 'Gradient Boosting Regressor'}`;
        const sqftPrice = Math.round(data.prediction / size);
        document.getElementById('resSqft').innerText = `$${sqftPrice} / sqft`;
        sheet.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
